<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil - Habit Tracker</title>

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-icon">
          H
        </div>

        <div>
          <h2>Habit Tracker</h2>
          <span>Build better habits</span>
        </div>

      </div>

      <nav class="sidebar-nav">

        <a href="dashboard.html" class="nav-item">
          <span>⌂</span>
          Dashboard
        </a>

        <a href="tracking.html" class="nav-item">
          <span>✓</span>
          Tracking
        </a>

        <a href="history.html" class="nav-item">
          <span>▣</span>
          Riwayat
        </a>

        <a href="category.html" class="nav-item">
          <span>◆</span>
          Kategori
        </a>

        <a href="profile.html" class="nav-item active">
          <span>●</span>
          Profil
        </a>

      </nav>

      <div class="sidebar-bottom">

        <button
          class="logout-button"
          id="logout-button"
        >
          Logout
        </button>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

      <!-- TOPBAR -->
      <header class="topbar">

        <div>

          <div class="page-label">
            PROFILE
          </div>

          <h1>Profil Saya</h1>

        </div>

        <div class="user-mini">

          <div
            class="user-avatar"
            id="user-avatar"
          >
            N
          </div>

          <div>

            <strong id="user-name">
              Loading...
            </strong>

            <span id="user-role">
              User
            </span>

          </div>

        </div>

      </header>


      <!-- PROFILE -->
      <section class="profile-section">

        <div class="profile-card">

          <div class="profile-header">

            <div
              class="profile-avatar"
              id="profile-avatar"
            >
              N
            </div>

            <div>

              <h2 id="profile-name-display">
                Loading...
              </h2>

              <p id="profile-email-display">
                Loading...
              </p>

            </div>

          </div>


          <div class="profile-divider"></div>


          <form id="profile-form">

            <div class="form-group">

              <label for="profile-name">
                Nama
              </label>

              <input
                type="text"
                id="profile-name"
                placeholder="Masukkan nama"
                required
              >

            </div>


            <div class="form-group">

              <label for="profile-email">
                Email
              </label>

              <input
                type="email"
                id="profile-email"
                placeholder="Masukkan email"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Role
              </label>

              <input
                type="text"
                id="profile-role"
                disabled
              >

            </div>


            <p
              id="profile-message"
              class="message"
            ></p>


            <div class="profile-actions">

              <button
                type="submit"
                class="primary-button"
              >
                Simpan Perubahan
              </button>

            </div>

          </form>

        </div>


        <!-- ACCOUNT INFORMATION -->
        <div class="profile-info-card">

          <span class="modal-label">
            ACCOUNT
          </span>

          <h2>Informasi Akun</h2>

          <div class="account-info">

            <div>

              <span>ID User</span>

              <strong id="profile-id">
                -
              </strong>

            </div>


            <div>

              <span>Dibuat</span>

              <strong id="profile-created">
                -
              </strong>

            </div>


            <div>

              <span>Diperbarui</span>

              <strong id="profile-updated">
                -
              </strong>

            </div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <script src="profile.js?v=1"></script>

</body>
</html>
