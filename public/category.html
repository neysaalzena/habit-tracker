<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kategori - Habit Tracker</title>

  <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-icon">
          H
        </div>

        <div>
          <h2>Habit Tracker</h2>
          <span>Build better habits</span>
        </div>

      </div>


      <nav class="sidebar-nav">

        <a href="dashboard.html" class="nav-item">
          <span>⌂</span>
          Dashboard
        </a>

        <a href="tracking.html" class="nav-item">
          <span>✓</span>
          Tracking
        </a>

        <a href="history.html" class="nav-item">
          <span>▣</span>
          Riwayat
        </a>

        <a href="category.html" class="nav-item active">
          <span>◆</span>
          Kategori
        </a>

        <a href="#" class="nav-item" id="profile-nav">
          <span>●</span>
          Profil
        </a>

      </nav>


      <div class="sidebar-bottom">

        <button
          class="logout-button"
          id="logout-button"
        >
          Logout
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

      <header class="topbar">

        <div>

          <div class="page-label">
            HABIT TRACKER
          </div>

          <h1>Kategori</h1>

        </div>


        <div class="user-mini">

          <div
            class="user-avatar"
            id="user-avatar"
          >
            N
          </div>

          <div>

            <strong id="user-name">
              Loading...
            </strong>

            <span id="user-role">
              User
            </span>

          </div>

        </div>

      </header>


      <!-- CATEGORY HEADER -->

      <section class="category-header">

        <div>

          <span class="section-label">
            HABIT CATEGORY
          </span>

          <h2>Kategori Habit</h2>

          <p>
            Kelompokkan habit agar lebih mudah dikelola.
          </p>

        </div>


        <button
          type="button"
          class="primary-button"
          id="add-category-button"
        >
          + Tambah Kategori
        </button>

      </section>


      <!-- MESSAGE -->

      <p
        id="category-message"
        class="category-message"
      ></p>


      <!-- CATEGORY LIST -->

      <section>

        <div
          id="category-list"
          class="category-list"
        >

          <p class="loading-text">
            Memuat kategori...
          </p>

        </div>

      </section>

    </main>

  </div>


  <!-- CATEGORY MODAL -->

  <div
    class="modal-overlay hidden"
    id="category-modal"
  >

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <span class="modal-label">
            CATEGORY
          </span>

          <h2 id="category-modal-title">
            Tambah Kategori
          </h2>

        </div>


        <button
          type="button"
          class="modal-close"
          id="close-category-modal"
        >
          ×
        </button>

      </div>


      <form id="category-form">

        <input
          type="hidden"
          id="category-id"
        >


        <div class="form-group">

          <label for="category-name">
            Nama Kategori
          </label>

          <input
            type="text"
            id="category-name"
            placeholder="Contoh: Kesehatan"
            maxlength="100"
            required
          >

        </div>


        <p
          id="category-form-message"
          class="message"
        ></p>


        <div class="modal-actions">

          <button
            type="button"
            class="secondary-button"
            id="cancel-category-modal"
          >
            Batal
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            Simpan Kategori
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="category.js?v=1"></script>

</body>

</html>
